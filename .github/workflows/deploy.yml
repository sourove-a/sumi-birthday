# Every push to main: build the site; if Hostinger FTP secrets are set, upload it live.
#
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#   FTP_SERVER    e.g. ftp.yourdomain.com   (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  your FTP user
#   FTP_PASSWORD  your FTP password
#   FTP_DIR       optional, default ./public_html/
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY   optional (shared wishes)

name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Job-level so the deploy step's `if` can see it
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload to Hostinger
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || './public_html/' }}
